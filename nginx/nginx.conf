server {
    listen 80;
    server_name localhost;

    # フロントエンド (React/Vite) へのルーティング
    # http://localhost/ など、/api/以外へのアクセスはここにマッチ
    location / {
        # Docker内のサービス名 `frontend` のポート `5173` へリクエストを転送
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # バックエンドAPI (NestJS) へのルーティング
    # http://localhost/api/users のようなアクセスはここにマッチ
    location /api {
        # /api/users を /users に書き換えてからバックエンドに渡す
        rewrite /api/(.*) /$1 break;
        
        # Docker内のサービス名 `backend` のポート `3000` へリクエストを転送
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket (Socket.io) へのルーティング
    location /socket.io/ {
        # こちらもバックエンド(backend:3000)へ転送
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}