# =============================================================================
# Dependabot 自動依存関係更新設定
# =============================================================================
#
# 概要:
#   依存関係を週次でチェックし、更新がある場合に PR を自動作成する。
#
# なぜ npm のエントリがルート 1 本だけなのか:
#   本リポジトリは npm workspaces で、依存関係の解決結果はルートの
#   package-lock.json に集約される。にもかかわらず backend/ は Docker の
#   ビルドコンテキストが backend/ 単独であるため独自の lockfile を持ち、
#   frontend/ も同様に lockfile を持つ（計 3 系統）。
#
#   以前は /backend と /frontend にも updates エントリを置いていたが、
#   Dependabot はそのディレクトリの lockfile しか更新しないため、
#   ルートの lockfile が取り残されて `npm ci` が EUSAGE で失敗し、
#   **依存を入れる全ジョブが連鎖的に落ちる**状態になっていた。
#   実際 2026-02 以降の PR 19 本がこの理由で 6 か月間マージ不能だった。
#
#   そこで npm はルート 1 本に集約し、派生 lockfile
#   （backend/ と frontend/）は .github/workflows/dependabot-lockfile.yml が
#   自動で再生成する。グループ定義もここに集約している。
#
# =============================================================================

version: 2
updates:
  # -------------------------------------------------------------------------
  # npm（workspaces 全体をルートから見る）
  # -------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # メジャー更新は移行作業を伴うため、グループに含めず個別 PR のままにする
      nestjs:
        patterns:
          - "@nestjs/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      tiptap:
        patterns:
          - "@tiptap/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@nestjs/*"
          - "react"
          - "react-dom"
          - "@types/react*"
          - "@tiptap/*"

  # -------------------------------------------------------------------------
  # GitHub Actions のバージョン更新
  # -------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
