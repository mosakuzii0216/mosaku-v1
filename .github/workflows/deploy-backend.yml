# =============================================================================
# バックエンド本番デプロイワークフロー
# =============================================================================
#
# 概要:
#   backend/ 配下のコードが main ブランチにマージされたとき、
#   自動的にテスト → ビルド → Cloud Run へデプロイを行う
#
# トリガー:
#   - main ブランチへの push (backend/ 配下の変更時)
#   - 手動実行 (GitHub Actions の UI から)
#
# 前提条件:
#   - Workload Identity Federation が設定されていること
#   - サービスアカウントに必要な権限が付与されていること
#     - roles/run.admin
#     - roles/storage.admin
#     - roles/iam.serviceAccountUser
#   - GitHub Environment 'production' が設定されていること（承認ゲート）
#
# =============================================================================

name: Deploy Backend to Cloud Run (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'デプロイするブランチ or コミットSHA（省略時は main HEAD）'
        required: false
        default: 'main'

# -----------------------------------------------------------------------------
# 環境変数（ワークフロー全体で使用）
# -----------------------------------------------------------------------------
env:
  PROJECT_ID: igneous-core-480923-j0          # GCP プロジェクトID
  REGION: asia-northeast1                      # Cloud Run のリージョン（東京）
  SERVICE_NAME: mosaku-backend                 # Cloud Run サービス名
  # Artifact Registry のイメージパス（asia-northeast1 の mosaku-backend リポジトリ配下の api イメージ）
  IMAGE_NAME: asia-northeast1-docker.pkg.dev/igneous-core-480923-j0/mosaku-backend/api

jobs:
  # ===========================================================================
  # Job 1: テスト & ビルド確認
  # ===========================================================================
  # デプロイ前にコードの品質をチェック
  # このジョブが失敗すると、デプロイは実行されない
  # ===========================================================================
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend  # すべてのコマンドを backend/ で実行

    steps:
      # -----------------------------------------------------------------------
      # Step 1: リポジトリのチェックアウト
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      # -----------------------------------------------------------------------
      # Step 2: Node.js 環境のセットアップ
      # -----------------------------------------------------------------------
      # package-lock.json をキーにして依存関係をキャッシュ
      # 2回目以降のビルドが高速化される
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # -----------------------------------------------------------------------
      # Step 3: 依存関係のインストール
      # -----------------------------------------------------------------------
      # npm ci は package-lock.json に従って厳密にインストール
      # npm install より高速で、CI/CD に適している
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Step 4: Prisma Client の生成
      # -----------------------------------------------------------------------
      # schema.prisma から TypeScript の型定義を生成
      # これがないとビルドが失敗する
      - name: Generate Prisma Client
        run: npx prisma generate

      # -----------------------------------------------------------------------
      # Step 5: Lint チェック
      # -----------------------------------------------------------------------
      # コードスタイルと潜在的なバグをチェック
      - name: Run linter
        run: npm run lint

      # -----------------------------------------------------------------------
      # Step 6: テスト実行
      # -----------------------------------------------------------------------
      # --passWithNoTests: テストファイルがなくてもエラーにしない
      - name: Run tests
        run: npm run test --passWithNoTests

      # -----------------------------------------------------------------------
      # Step 7: TypeScript ビルド
      # -----------------------------------------------------------------------
      # 型エラーがないことを確認
      - name: Build TypeScript
        run: npm run build

  # ===========================================================================
  # Job 2: DBマイグレーション（本番）
  # ===========================================================================
  migrate:
    name: DB Migration (Production)
    needs: test
    runs-on: ubuntu-latest
    environment: production  # 本番マイグレーションも承認ゲートを通す
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run DB migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

  # ===========================================================================
  # Job 3: Cloud Run へデプロイ
  # ===========================================================================
  # test・migrate ジョブが成功した場合のみ実行
  # Docker イメージをビルドして Cloud Run にデプロイ
  # ===========================================================================
  deploy:
    name: Deploy to Cloud Run (Production)
    needs: migrate
    runs-on: ubuntu-latest
    environment: production  # GitHub Environment による承認ゲート
    # Workload Identity Federation で OIDC トークンを発行するために必要
    permissions:
      contents: read
      id-token: write

    steps:
      # -----------------------------------------------------------------------
      # Step 1: リポジトリのチェックアウト
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      # -----------------------------------------------------------------------
      # Step 2: GCP 認証（Workload Identity Federation）
      # -----------------------------------------------------------------------
      # GitHub Actions の OIDC トークンを GCP が検証して、SA の短寿命トークンを発行
      # SA キーを GitHub Secrets に保存しないので漏洩リスクが無い
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/129805115778/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@igneous-core-480923-j0.iam.gserviceaccount.com

      # -----------------------------------------------------------------------
      # Step 3: Cloud SDK セットアップ
      # -----------------------------------------------------------------------
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # -----------------------------------------------------------------------
      # Step 4: Docker 認証設定
      # -----------------------------------------------------------------------
      # Artifact Registry (asia-northeast1-docker.pkg.dev) にプッシュするための認証
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      # -----------------------------------------------------------------------
      # Step 5: Docker イメージのビルド & プッシュ
      # -----------------------------------------------------------------------
      # Cloud Build を使用してイメージをビルド
      # コミットSHAをタグとして使用（ロールバック時に特定バージョンを指定可能）
      - name: Build and push Docker image
        run: |
          cd backend
          gcloud builds submit \
            --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --timeout=20m \
            --quiet

      # -----------------------------------------------------------------------
      # Step 6: Cloud Run へデプロイ
      # -----------------------------------------------------------------------
      # コミットSHAタグのイメージを使用（トレーサビリティのため）
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --quiet

      # -----------------------------------------------------------------------
      # Step 7: デプロイ結果の表示
      # -----------------------------------------------------------------------
      # GitHub Actions の Summary にデプロイ情報を表示
      - name: Show deployment URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "## Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service URL:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 3: Slack通知
  # ===========================================================================
  # デプロイの成功/失敗をSlackに通知
  # ===========================================================================
  notify:
    name: Slack Notification
    needs: [migrate, deploy]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Slack通知
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.deploy.result }}
          fields: repo,message,commit,author,workflow
