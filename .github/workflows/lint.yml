name: Code Quality Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend-lint:
    name: frontend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js (root)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspaces (root)
        run: npm ci
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prettier format check
        run: npm run format:check
        working-directory: frontend

      - name: ESLintでコードチェック
        run: npm run lint
        working-directory: frontend

      - name: TypeScript型チェック
        run: npx tsc --noEmit
        working-directory: frontend

  backend-lint:
    name: backend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js (root)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspaces (root)
        run: npm ci
      - name: Setup Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prettier format check
        run: npm run format:check
        working-directory: backend

      - name: Prismaクライアント生成
        run: npx prisma generate
        working-directory: backend

      - name: ESLintでコードチェック
        run: npm run lint
        working-directory: backend
