name: Code Quality Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend-lint:
    name: frontend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspaces (root)
        run: npm ci

      - name: Prettier format check
        run: npm run format:check
        working-directory: frontend

      - name: ESLintでコードチェック
        run: npm run lint
        working-directory: frontend

      - name: TypeScript型チェック
        run: npx tsc --noEmit
        working-directory: frontend

  backend-lint:
    name: backend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspaces (root)
        run: npm ci

      - name: Prettier format check
        run: npm run format:check
        working-directory: backend

      - name: Prismaクライアント生成
        run: npx prisma generate
        working-directory: backend

      - name: ESLintでコードチェック
        run: npm run lint
        working-directory: backend

  # ===========================================================================
  # lockfile 同期チェック
  # ===========================================================================
  # 本リポジトリは lockfile が root / backend / frontend の 3 系統あり、
  # Dependabot もそれぞれに PR を出すため「片方だけ更新される」ズレが起きうる。
  # npm ci は逆向きのズレ（package.json から消したのに lockfile に残る宣言）を
  # 検知できないので、専用スクリプトで検査する。
  # JSON を読むだけなので npm ci は不要。
  # ===========================================================================
  lockfile-sync:
    name: lockfile sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: lockfile と package.json の同期チェック
        run: node scripts/check-lockfile-sync.mjs
