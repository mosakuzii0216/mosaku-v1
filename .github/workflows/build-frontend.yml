# =============================================================================
# フロントエンド PR ビルドチェックワークフロー
# =============================================================================
#
# 概要:
#   Pull Request で frontend/ 配下のコードが変更されたとき、
#   Vite ビルドが成功することを確認する
#
# トリガー:
#   - すべての Pull Request（実行要否は changes ジョブが判定する）
#
# `paths:` を使わない理由は scripts/detect-changed-areas.sh のヘッダを参照。
# 要約: paths: だと workflow ごと発火せず、必須ステータスチェックが永久に
# pending になりマージ不能になる。job の if: なら skipped として報告される。
#
# =============================================================================

name: Frontend Build Check

on:
  pull_request:

jobs:
  # ===========================================================================
  # Job: 変更範囲の判定
  # ===========================================================================
  changes:
    name: 変更範囲の判定（frontend）
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/detect-changed-areas.sh
          sparse-checkout-cone-mode: false

      - name: 変更エリアを判定
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/detect-changed-areas.sh

  # ===========================================================================
  # Job: フロントエンドビルド確認
  # ===========================================================================
  build:
    name: frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Step 1: リポジトリのチェックアウト
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 2: Node.js 環境のセットアップ
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # -----------------------------------------------------------------------
      # Step 3: 依存関係のインストール
      # -----------------------------------------------------------------------
      # モノレポのルートから npm ci で全ワークスペースをインストール
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Step 4: Vite ビルド確認
      # -----------------------------------------------------------------------
      # TypeScript型チェック + Viteビルドを実行
      # frontend の build スクリプトは "tsc -b && vite build"
      - name: Viteビルド確認
        run: npm run build -w frontend

      # -----------------------------------------------------------------------
      # Step 5: Precache サイズ計測（PWA app-shell ガード）
      # -----------------------------------------------------------------------
      # PRECACHE_BASELINE_BYTES が未設定の間は計測のみ。値が設定されると
      # 1.5x ガードが有効になり、超過時は CI が失敗する（Requirement 8.3）。
      - name: Precache サイズ計測
        env:
          PRECACHE_BASELINE_BYTES: ${{ vars.PRECACHE_BASELINE_BYTES }}
        run: npm run check:precache -w frontend
