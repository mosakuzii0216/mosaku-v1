# =============================================================================
# フロントエンド PR ビルドチェックワークフロー
# =============================================================================
#
# 概要:
#   Pull Request で frontend/ 配下のコードが変更されたとき、
#   Vite ビルドが成功することを確認する
#
# トリガー:
#   - frontend/ 配下を変更する Pull Request
#
# =============================================================================

name: Frontend Build Check

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend.yml'

jobs:
  # ===========================================================================
  # Job: フロントエンドビルド確認
  # ===========================================================================
  build:
    name: frontend build
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Step 1: リポジトリのチェックアウト
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 2: Node.js 環境のセットアップ
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # -----------------------------------------------------------------------
      # Step 3: 依存関係のインストール
      # -----------------------------------------------------------------------
      # モノレポのルートから npm ci で全ワークスペースをインストール
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Step 4: Vite ビルド確認
      # -----------------------------------------------------------------------
      # TypeScript型チェック + Viteビルドを実行
      # frontend の build スクリプトは "tsc -b && vite build"
      - name: Viteビルド確認
        run: npm run build -w frontend

      # -----------------------------------------------------------------------
      # Step 5: Precache サイズ計測（PWA app-shell ガード）
      # -----------------------------------------------------------------------
      # PRECACHE_BASELINE_BYTES が未設定の間は計測のみ。値が設定されると
      # 1.5x ガードが有効になり、超過時は CI が失敗する（Requirement 8.3）。
      - name: Precache サイズ計測
        env:
          PRECACHE_BASELINE_BYTES: ${{ vars.PRECACHE_BASELINE_BYTES }}
        run: npm run check:precache -w frontend
