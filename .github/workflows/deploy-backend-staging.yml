# =============================================================================
# バックエンド ステージングデプロイワークフロー
# =============================================================================
#
# 概要:
#   backend/ 配下のコードが main ブランチにマージされたとき、
#   自動的にステージング環境へデプロイする
#   本番デプロイは deploy-backend.yml で手動承認後に実行
#
# トリガー:
#   - main ブランチへの push (backend/ 配下の変更時のみ)
#   - 手動実行
#
# 前提条件:
#   - GitHub Secrets に GCP_SA_KEY が登録されていること
#   - Cloud Run に mosaku-backend-staging サービスが作成されていること
#
# =============================================================================

name: Deploy Backend to Staging

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-staging.yml'
  workflow_dispatch:

# -----------------------------------------------------------------------------
# 環境変数（ワークフロー全体で使用）
# -----------------------------------------------------------------------------
env:
  PROJECT_ID: igneous-core-480923-j0
  REGION: asia-northeast1
  SERVICE_NAME: mosaku-backend-staging
  IMAGE_NAME: gcr.io/igneous-core-480923-j0/mosaku-backend

jobs:
  # ===========================================================================
  # Job 1: テスト & ビルド確認
  # ===========================================================================
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test --passWithNoTests

      - name: Build TypeScript
        run: npm run build

  # ===========================================================================
  # Job 2: DBマイグレーション（ステージング）
  # ===========================================================================
  migrate-staging:
    name: DB Migration (Staging)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run DB migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}

  # ===========================================================================
  # Job 3: ステージング環境へデプロイ
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: migrate-staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      # -----------------------------------------------------------------------
      # staging- プレフィックス付きタグでビルド
      # -----------------------------------------------------------------------
      - name: Build and push Docker image
        run: |
          cd backend
          gcloud builds submit \
            --tag ${{ env.IMAGE_NAME }}:staging-${{ github.sha }} \
            --timeout=20m \
            --quiet

      - name: Deploy to Cloud Run (Staging)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_NAME }}:staging-${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --quiet

      - name: Show staging URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "## Staging Deployment Successful! :test_tube:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Staging URL:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.IMAGE_NAME }}:staging-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 3: Slack通知
  # ===========================================================================
  notify:
    name: Slack Notification
    needs: [migrate-staging, deploy-staging]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Slack通知
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.deploy-staging.result }}
          fields: repo,message,commit,author,workflow
