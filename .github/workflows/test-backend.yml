# =============================================================================
# バックエンド PR テストワークフロー
# =============================================================================
#
# 概要:
#   Pull Request で backend/ 配下のコードが変更されたとき、
#   自動的にテストを実行して品質をチェックする
#
# トリガー:
#   - すべての Pull Request（実行要否は changes ジョブが判定する）
#
# 目的:
#   - マージ前にテストが通ることを確認
#   - カバレッジレポートを生成して品質を可視化
#
# なぜ `paths:` を使わないか:
#   `paths:` は条件に合わない PR で workflow ごと発火しないため、必須ステータス
#   チェックに指定すると報告が来ず永久に pending になる。job レベルの `if:` で
#   落とせば skipped として報告され必須チェックを満たす。詳細は
#   scripts/detect-changed-areas.sh のヘッダを参照。
#
# =============================================================================

name: Backend Tests

on:
  pull_request:

jobs:
  # ===========================================================================
  # Job: 変更範囲の判定
  # ===========================================================================
  changes:
    name: 変更範囲の判定（backend）
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/detect-changed-areas.sh
          sparse-checkout-cone-mode: false

      - name: 変更エリアを判定
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/detect-changed-areas.sh

  # ===========================================================================
  # Job: テスト実行
  # ===========================================================================
  test:
    name: Run Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend  # すべてのコマンドを backend/ で実行

    steps:
      # -----------------------------------------------------------------------
      # Step 1: リポジトリのチェックアウト
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 2: Node.js 環境のセットアップ
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # -----------------------------------------------------------------------
      # Step 3: 依存関係のインストール
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Step 4: Prisma Client の生成
      # -----------------------------------------------------------------------
      - name: Generate Prisma Client
        run: npx prisma generate

      # -----------------------------------------------------------------------
      # Step 5: テスト実行（カバレッジ付き）
      # -----------------------------------------------------------------------
      # --passWithNoTests: テストファイルがなくてもエラーにしない
      # test:cov: カバレッジレポートを生成
      - name: Run tests with coverage
        run: npm run test:cov -- --passWithNoTests

      # -----------------------------------------------------------------------
      # Step 6: TypeScript ビルド確認
      # -----------------------------------------------------------------------
      # 型エラーがないことを確認
      - name: Build TypeScript
        run: npm run build

      # -----------------------------------------------------------------------
      # Step 7: カバレッジレポートのアップロード
      # -----------------------------------------------------------------------
      # 7日間保存され、GitHub Actions の Artifacts からダウンロード可能
      # if: always() により、テストが失敗しても実行される
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 7

  # ===========================================================================
  # Job 2: E2Eテスト実行
  # ===========================================================================
  # PostgreSQL サービスコンテナを使用して実際のDB接続でテスト
  # ===========================================================================
  e2e-test:
    name: Run Backend E2E Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # -----------------------------------------------------------------------
    # PostgreSQL サービスコンテナ
    # -----------------------------------------------------------------------
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: mosaku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/mosaku_test
      DIRECT_URL: postgresql://testuser:testpass@localhost:5432/mosaku_test
      JWT_SECRET: test-jwt-secret-for-ci
      SESSION_SECRET: test-session-secret-for-ci
      ADMIN_EMAIL: test@example.com

    steps:
      # -----------------------------------------------------------------------
      # Step 1: リポジトリのチェックアウト
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 2: Node.js 環境のセットアップ
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # -----------------------------------------------------------------------
      # Step 3: 依存関係のインストール
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Step 4: Prisma Client の生成
      # -----------------------------------------------------------------------
      - name: Generate Prisma Client
        run: npx prisma generate

      # -----------------------------------------------------------------------
      # Step 5: テスト用DBにマイグレーション適用
      # -----------------------------------------------------------------------
      - name: Apply migrations
        run: npx prisma migrate deploy

      # -----------------------------------------------------------------------
      # Step 6: E2Eテスト実行
      # -----------------------------------------------------------------------
      - name: Run E2E tests
        run: npm run test:e2e -- --passWithNoTests
