version: '3.8'

services:
  # バックエンド (Nest.js) サービス
  backend:
    build:
      context: ./backend      # ./backend ディレクトリのDockerfileを使う
      target: development     # Dockerfile内の development ステージをビルド
    container_name: memo-app-backend
    volumes:
      - ./backend/src:/usr/src/app/src
      - ./backend/prisma:/usr/src/app/prisma
      - ./backend/package.json:/usr/src/app/package.json
      - ./backend/package-lock.json:/usr/src/app/package-lock.json
      - ./backend/tsconfig.json:/usr/src/app/tsconfig.json
      - ./backend/tsconfig.build.json:/usr/src/app/tsconfig.build.json
      - ./backend/nest-cli.json:/usr/src/app/nest-cli.json
    ports:
      - "3000:3000"            # コンテナの3000番ポートをホストに公開（デバッグ用）
    env_file: ./.env             # .envファイルから環境変数を読み込む
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@db:5432/memodb?schema=public
    restart: unless-stopped      # コンテナが落ちたら自動で再起動

  # フロントエンド (React) サービス
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: memo-app-frontend
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "5173:5173"            # Viteの開発サーバーポートを公開
    env_file: ./.env
    restart: unless-stopped

  # ローカルデータベース (PostgreSQL) サービス
  # オフライン開発用 - プロファイル "local" で起動
  db:
    image: postgres:16-alpine
    container_name: memo-app-db
    profiles: ["local"]  # --profile local で起動する
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: memodb
    restart: unless-stopped

  # リバースプロキシ (Nginx) サービス
  nginx:
    build: ./nginx       # ./nginx ディレクトリのDockerfileを使う
    container_name: memo-app-proxy
    ports:
      - "80:80"                # 外部からの窓口となる80番ポートを公開
    depends_on:
      - frontend
      - backend

# ローカルDB用の永続化ボリューム
volumes:
  postgres_data: